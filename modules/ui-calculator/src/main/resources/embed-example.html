<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed Example — PrintCraft Price Calculator Widget</title>
  <style>
    body { margin: 0; padding: 32px 20px; background: #FFF; font-family: system-ui, -apple-system, sans-serif; color: #0F172A; }
    .host-container { max-width: 1160px; margin: 0 auto; }
    .host-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #E2E8F0; }
    code { background: #F1F5F9; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="host-container">
    <header class="host-header">
      <h1>Partner Website — Embedded Calculator Example</h1>
      <p>
        Drop-in widget mounted via <code>MPCalculator.mount("#widget", { lang: "en", currency: "CZK", orderEmail: "sales@example.com" })</code>.
        Zero external CSS files needed — Kyo UI injects its own scoped stylesheet automatically.
      </p>
    </header>
    <div id="widget"></div>
  </div>

  <script src="main.js"></script>
  <script>
    MPCalculator.mount("#widget", {
      lang: "en",
      currency: "CZK",
      orderEmail: "sales@example.com"
    });
  </script>
</body>
</html>
