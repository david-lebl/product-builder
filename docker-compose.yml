services:
  postgres:
    image: postgres:16-alpine
    container_name: mpbuilder-postgres
    environment:
      POSTGRES_DB: mpbuilder
      POSTGRES_USER: mpbuilder
      POSTGRES_PASSWORD: mpbuilder
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpbuilder -d mpbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
