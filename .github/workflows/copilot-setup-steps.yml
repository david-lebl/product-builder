name: "Copilot Setup Steps"

# Allow manual runs from the Actions tab for validation.
# Copilot coding agent runs the `copilot-setup-steps` job automatically
# before starting any task — no push/PR trigger needed.
on:
  workflow_dispatch:

jobs:
  # Job name MUST be `copilot-setup-steps` to be picked up by Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Temurin JDK 25 — required by Kyo 1.0.0-RC7 (class file version 69.0)
      # and includes the root CA certificates needed by Coursier for Maven Central.
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/*.mill', '.mill-version') }}
          restore-keys: ${{ runner.os }}-coursier-

      - name: Cache Mill download
        uses: actions/cache@v4
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('.mill-version') }}
