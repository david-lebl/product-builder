name: "Copilot Setup Steps"

# Allow manual runs from the Actions tab for validation.
# Copilot coding agent runs the `copilot-setup-steps` job automatically
# before starting any task — no push/PR trigger needed.
on:
  workflow_dispatch:

jobs:
  # Job name MUST be `copilot-setup-steps` to be picked up by Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Install Temurin JDK 25 — required by Kyo 1.0.0-RC7 (class file version 69.0)
      # and includes the root CA certificates needed by Coursier for Maven Central.
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Coursier dependency cache + Mill launcher download (~/.cache/mill).
      - uses: coursier/cache-action@v9

      # Download Mill and every dependency up front so the agent's first build
      # does not spend minutes resolving (the agent firewall may also block it later).
      - name: Warm Mill & dependencies
        run: ./mill __.prepareOffline
