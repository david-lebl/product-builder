name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR / branch: a new push cancels the outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting check (scalafmt, configured in .scalafmt.conf).
  # REPORT-ONLY until the one-shot reformat of the code base lands
  # (see docs/analysis/ci-optimization-plan.md, section 2.1). Afterwards delete `continue-on-error`.
  format:
    name: Format (scalafmt)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: coursier/cache-action@v9

      - name: Check formatting
        run: ./mill mill.scalalib.scalafmt/checkFormatAll

  build:
    name: Compile, test & link
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Caches the Coursier dependency cache and the Mill launcher download (~/.cache/mill),
      # keyed on build.mill / .mill-version.
      - uses: coursier/cache-action@v9

      - name: Compile (JVM + Scala.js, incl. test sources)
        run: ./mill __.compile

      # Includes the PostgreSQL contract suites (kyo-pod uses the runner's Docker daemon).
      - name: Test
        run: ./mill __.test

      - name: Link Scala.js bundles
        run: ./mill '{ui,ui-admin,ui-calculator,ui-editor}.fastLinkJS'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: out/**/test-report.xml
          if-no-files-found: ignore
          retention-days: 7
