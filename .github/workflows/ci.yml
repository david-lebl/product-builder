name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-mill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/*.mill', '.mill-version') }}
          restore-keys: ${{ runner.os }}-coursier-

      - name: Install Mill
        run: |
          curl -fL "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.3/mill-dist-1.1.3-mill.sh" -o /usr/local/bin/mill
          chmod +x /usr/local/bin/mill

      # Bounded-context boundaries are only worth having if they are enforced. This is
      # cheap to hold now and expensive to recover once violated.
      - name: Check module dependency rules
        run: ./scripts/check-module-deps.sh

      - name: Compile
        run: mill __.compile

      - name: Test
        run: mill __.test

      # calculator.css is generated from the SPA's stylesheets but committed, so
      # editing one of them without regenerating would silently ship stale CSS.
      - name: Check calculator.css is up to date
        run: |
          ./modules/ui-calculator/build-css.sh
          if ! git diff --quiet -- modules/ui-calculator/src/main/resources/calculator.css; then
            echo "::error::calculator.css is out of date. Run ./modules/ui-calculator/build-css.sh and commit the result."
            git diff --stat -- modules/ui-calculator/src/main/resources/calculator.css
            exit 1
          fi


