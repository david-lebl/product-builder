name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  # Queue rather than cancel: never abort a half-finished push to gh-pages.
  cancel-in-progress: false

jobs:
  deploy-preview:
    # Fork PRs get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Must run for `closed` too: the preview removal commits to gh-pages
      # from this checkout ("fatal: not in a git directory" otherwise).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        if: github.event.action != 'closed'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - if: github.event.action != 'closed'
        uses: coursier/cache-action@v9

      - name: Build & assemble site
        if: github.event.action != 'closed'
        run: scripts/assemble-site.sh _site

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
