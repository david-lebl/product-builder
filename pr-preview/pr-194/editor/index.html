<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PrintCraft Design Studio</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <script>
    try { document.documentElement.setAttribute("data-theme", localStorage.getItem("mpbuilder.theme") || "system"); } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #F6F7FB; overflow: hidden; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #0B0F19; }
    @media (prefers-color-scheme: dark) { html[data-theme="system"], html[data-theme="system"] body { background: #0B0F19; } }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <script src="main.js"></script>
</body>
</html>
