<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintCraft Studio — Price Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #F1F5F9; font-family: system-ui, -apple-system, sans-serif; }
    #calculator-root { max-width: 1180px; margin: 0 auto; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="calculator-root"></div>
  <script src="main.js"></script>
  <script>
    MPCalculator.mount("#calculator-root", {
      lang: (navigator.language || "en").toLowerCase().startsWith("cs") ? "cs" : "en",
      currency: "CZK",
      orderEmail: "orders@printcraft.studio"
    });
  </script>
</body>
</html>
